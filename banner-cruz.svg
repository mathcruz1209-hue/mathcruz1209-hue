<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">CRUZ</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#E5162F"/>
      <stop offset="0.65" stop-color="#C20F25"/>
      <stop offset="1" stop-color="#7E0A19"/>
    </radialGradient>
    <linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0" gradientTransform="skewX(-20)">
      <stop offset="0" stop-color="#FF2D46" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2D46" stop-opacity="1"/>
      <stop offset="1" stop-color="#FF2D46" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" additive="sum"
        values="-500 0;1800 0;1800 0" keyTimes="0;0.3;1" dur="6s" begin="2.6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <g id="all"><path d="M505,150 H395 Q365,150,365,180 V320 Q365,350,395,350 H505"/><path d="M575,350 V150 H675 Q715,150,715,190 V220 Q715,260,675,260 H575 M657,260 L715,350"/><path d="M785,150 V320 Q785,350,815,350 H895 Q925,350,925,320 V150"/><path d="M995,150 H1135 L995,350 H1135"/></g>
  </defs>

  <style>
    .l { animation: draw 1s cubic-bezier(.65,0,.25,1) both; }
    .l1 { animation-delay: .4s } .l2 { animation-delay: .65s }
    .l3 { animation-delay: .9s }  .l4 { animation-delay: 1.15s }
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1; }
      to   { stroke-dasharray: 1; stroke-dashoffset: 0; }
    }
    #title { transform-box: fill-box; transform-origin: center; animation: pop 1.4s ease-in-out 2.3s both; }
    @keyframes pop { 0%,100% { transform: scale(1); } 45% { transform: scale(1.035); } }
    .glow { opacity: .3; animation: glow 2s ease-out 2s both; }
    @keyframes glow { 0% { opacity: 0; } 35% { opacity: .65; } 100% { opacity: .3; } }
    .lines { animation: slide 14s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(-70px); } to { transform: translateX(70px); } }
    .p { opacity: .7; animation: rise linear infinite; }
    @keyframes rise {
      0%   { transform: translate(0,0); opacity: 0; }
      15%  { opacity: .85; }
      100% { transform: translate(var(--dx),-150px); opacity: 0; }
    }
    .ring { transform-box: fill-box; transform-origin: center; animation: breathe 9s ease-in-out infinite alternate; }
    @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Fundo -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <circle class="ring" cx="1330" cy="-40" r="270" fill="#9E0E20" opacity=".45"/>
  <circle class="ring" cx="130" cy="560" r="300" fill="#9E0E20" opacity=".45"/>
  <g class="lines" stroke="#ffffff" stroke-opacity=".09" stroke-width="2"><line x1="-500" y1="520" x2="-240" y2="-20"/><line x1="-310" y1="520" x2="-50" y2="-20"/><line x1="-120" y1="520" x2="140" y2="-20"/><line x1="70" y1="520" x2="330" y2="-20"/><line x1="260" y1="520" x2="520" y2="-20"/><line x1="450" y1="520" x2="710" y2="-20"/><line x1="640" y1="520" x2="900" y2="-20"/><line x1="830" y1="520" x2="1090" y2="-20"/><line x1="1020" y1="520" x2="1280" y2="-20"/><line x1="1210" y1="520" x2="1470" y2="-20"/><line x1="1400" y1="520" x2="1660" y2="-20"/><line x1="1590" y1="520" x2="1850" y2="-20"/></g>

  <!-- Partículas -->
  <g>
    <circle class="p" cx="703" cy="197" r="2.4" fill="#ffc2c9" style="animation-duration:7.3s;animation-delay:-9.9s;--dx:-30px"/>
    <circle class="p" cx="1233" cy="149" r="3.4" fill="#ffffff" style="animation-duration:8.3s;animation-delay:-1.0s;--dx:30px"/>
    <circle class="p" cx="532" cy="166" r="2.7" fill="#ff6b7d" style="animation-duration:7.4s;animation-delay:-6.8s;--dx:-15px"/>
    <circle class="p" cx="1324" cy="418" r="3.5" fill="#ffffff" style="animation-duration:10.5s;animation-delay:-4.8s;--dx:-15px"/>
    <circle class="p" cx="1180" cy="188" r="2.2" fill="#ff6b7d" style="animation-duration:7.9s;animation-delay:-1.4s;--dx:15px"/>
    <circle class="p" cx="1436" cy="212" r="1.8" fill="#ff6b7d" style="animation-duration:10.4s;animation-delay:-2.3s;--dx:-30px"/>
    <circle class="p" cx="168" cy="408" r="1.7" fill="#ffc2c9" style="animation-duration:8.2s;animation-delay:-8.2s;--dx:30px"/>
    <circle class="p" cx="993" cy="419" r="3.4" fill="#ff6b7d" style="animation-duration:9.2s;animation-delay:-3.0s;--dx:-15px"/>
    <circle class="p" cx="539" cy="161" r="2.7" fill="#ffc2c9" style="animation-duration:10.2s;animation-delay:-10.5s;--dx:30px"/>
    <circle class="p" cx="1287" cy="157" r="1.8" fill="#ffc2c9" style="animation-duration:9.5s;animation-delay:-9.1s;--dx:-15px"/>
    <circle class="p" cx="903" cy="140" r="3.5" fill="#ffc2c9" style="animation-duration:7.5s;animation-delay:-6.7s;--dx:15px"/>
    <circle class="p" cx="757" cy="424" r="2.6" fill="#ffc2c9" style="animation-duration:11.8s;animation-delay:-0.8s;--dx:-30px"/>
    <circle class="p" cx="1010" cy="476" r="2.9" fill="#ffc2c9" style="animation-duration:7.4s;animation-delay:-8.4s;--dx:30px"/>
    <circle class="p" cx="830" cy="462" r="2.3" fill="#ffc2c9" style="animation-duration:12.6s;animation-delay:-4.3s;--dx:-30px"/>
    <circle class="p" cx="160" cy="231" r="3.1" fill="#ffc2c9" style="animation-duration:7.8s;animation-delay:-3.0s;--dx:30px"/>
    <circle class="p" cx="205" cy="205" r="2.5" fill="#ff6b7d" style="animation-duration:10.3s;animation-delay:-10.6s;--dx:30px"/>
    <circle class="p" cx="610" cy="481" r="2.4" fill="#ffffff" style="animation-duration:9.2s;animation-delay:-10.6s;--dx:-15px"/>
    <circle class="p" cx="209" cy="210" r="1.9" fill="#ffc2c9" style="animation-duration:11.0s;animation-delay:-0.1s;--dx:-15px"/>
  </g>

  <!-- Brilho atrás do nome -->
  <use href="#all" class="glow" fill="none" stroke="#ffffff" stroke-width="46" stroke-linejoin="round" filter="url(#blur)"/>

  <!-- Nome -->
  <g id="title" fill="none" stroke="#ffffff" stroke-width="42" stroke-linejoin="round" stroke-linecap="butt">
    <path class="l l1" pathLength="1" d="M505,150 H395 Q365,150,365,180 V320 Q365,350,395,350 H505"/><path class="l l2" pathLength="1" d="M575,350 V150 H675 Q715,150,715,190 V220 Q715,260,675,260 H575 M657,260 L715,350"/><path class="l l3" pathLength="1" d="M785,150 V320 Q785,350,815,350 H895 Q925,350,925,320 V150"/><path class="l l4" pathLength="1" d="M995,150 H1135 L995,350 H1135" stroke-linejoin="miter"/>
    <!-- Faixa de luz vermelha que passa sobre as letras -->
    <use href="#all" stroke="url(#sh)" stroke-width="42" stroke-linejoin="round"/>
  </g>
</svg>
